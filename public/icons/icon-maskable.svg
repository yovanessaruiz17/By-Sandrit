<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C3F52" />
      <stop offset="100%" stop-color="#5B2333" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="50%" stop-color="#C59B4E" />
      <stop offset="100%" stop-color="#9E7632" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center Content scaled within 80% safe zone (radius 204px) -->
  <g transform="translate(0, 10)">
    <!-- Botanical Flower Accent -->
    <g transform="translate(256, 175)">
      <path d="M0 -65 C22 -35 30 -8 0 20 C-30 -8 -22 -35 0 -65 Z" fill="url(#goldGradMask)" opacity="0.9" />
      <path d="M55 -30 C42 -4 20 12 -12 16 C4 -12 30 -25 55 -30 Z" fill="url(#goldGradMask)" opacity="0.75" />
      <path d="M-55 -30 C-42 -4 -20 12 12 16 C-4 -12 -30 -25 -55 -30 Z" fill="url(#goldGradMask)" opacity="0.75" />
      <circle cx="0" cy="16" r="6" fill="#FFF8F0" />
    </g>

    <!-- "BY" -->
    <text x="256" y="275" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="600" fill="#FAF2F3" letter-spacing="10" text-anchor="middle" opacity="0.95">
      BY
    </text>

    <!-- "SANDRIT" -->
    <text x="256" y="335" font-family="'Playfair Display', 'Georgia', serif" font-size="44" font-weight="700" fill="url(#goldGradMask)" letter-spacing="8" text-anchor="middle">
      SANDRIT
    </text>

    <!-- Subtitle -->
    <text x="256" y="375" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#F2D7D9" letter-spacing="6" text-anchor="middle" opacity="0.9">
      ESTÉTICA &amp; SPA
    </text>
  </g>
</svg>
