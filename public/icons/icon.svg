<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C3F52" />
      <stop offset="100%" stop-color="#5B2333" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="50%" stop-color="#C59B4E" />
      <stop offset="100%" stop-color="#9E7632" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners for icon preview -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Elegant Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Botanical / Aesthetic Floral Accent -->
  <g filter="url(#glow)" transform="translate(256, 175)">
    <!-- Petals -->
    <path d="M0 -75 C25 -40 35 -10 0 25 C-35 -10 -25 -40 0 -75 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M65 -35 C50 -5 25 15 -15 20 C5 -15 35 -30 65 -35 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M-65 -35 C-50 -5 -25 15 15 20 C-5 -15 -35 -30 -65 -35 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M50 35 C25 35 5 20 -10 -5 C15 -5 45 10 50 35 Z" fill="url(#goldGrad)" opacity="0.6" />
    <path d="M-50 35 C-25 35 -5 20 10 -5 C-15 -5 -45 10 -50 35 Z" fill="url(#goldGrad)" opacity="0.6" />
    <!-- Center Pearl -->
    <circle cx="0" cy="18" r="7" fill="#FFF8F0" />
  </g>

  <!-- Brand Typography / Monogram -->
  <!-- "BY" -->
  <text x="256" y="295" font-family="'Playfair Display', 'Georgia', serif" font-size="34" font-weight="600" fill="#FAF2F3" letter-spacing="12" text-anchor="middle" opacity="0.9">
    BY
  </text>

  <!-- "SANDRIT" -->
  <text x="256" y="360" font-family="'Playfair Display', 'Georgia', serif" font-size="52" font-weight="700" fill="url(#goldGrad)" letter-spacing="10" text-anchor="middle" filter="url(#glow)">
    SANDRIT
  </text>

  <!-- Subtitle / Specialty -->
  <text x="256" y="405" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="16" font-weight="500" fill="#F2D7D9" letter-spacing="8" text-anchor="middle" opacity="0.85">
    ESTÉTICA &amp; SPA
  </text>

  <!-- Small Gold Dot Decorator -->
  <circle cx="256" cy="435" r="3.5" fill="url(#goldGrad)" />
</svg>
